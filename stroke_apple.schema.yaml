# Apple-style six-key stroke prototype for Rime.
# Independent of the original stroke.schema.yaml, which remains unchanged.
# Uses the upstream stroke.dict.yaml; does not contain Apple dictionary data.
schema:
  schema_id: stroke_apple
  name: "Conway 繁體六鍵筆畫（實驗）"
  version: "0.2.0"
  author:
    - Rime stroke contributors
    - kitolspeaker (Apple-style adaptation)
  description: |
    按鍵 J/K/L/U/I = 橫/豎/撇/點/折，O = 萬用（任意單筆）。
    採用 Conway 香港繁體字頻與五筆前綴（最多五筆）及逐筆萬用鍵。
    非 Apple 官方輸入法或原生候選排序。
  dependencies:
    - luna_pinyin

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: traditional
    reset: 1
    states: [ 原碼, 繁體 ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
  filters:
    - simplifier@traditional
    - uniquifier

speller:
  # Conway dictionary already uses Apple-style J/K/L/U/I, truncated to
  # the FIRST FIVE strokes. The wildcard O matches exactly one stroke.
  alphabet: "jkluio"
  delimiter: " '"
  algebra:
    - derive/^([jkluio]{4})([jklui])([jkluio]*)$/$1o$3/
    - derive/^([jkluio]{3})([jklui])([jkluio]*)$/$1o$3/
    - derive/^([jkluio]{2})([jklui])([jkluio]*)$/$1o$3/
    - derive/^([jkluio]{1})([jklui])([jkluio]*)$/$1o$3/
    - derive/^([jkluio]{0})([jklui])([jkluio]*)$/$1o$3/

menu:
  page_size: 9

translator:
  dictionary: stroke_apple
  enable_completion: true
  enable_user_dict: true
  enable_sentence: true
  preedit_format:
    - xlit/jkluio/一丨丿丶乛＊/
  comment_format:
    - xform/~//

traditional:
  option_name: traditional
  opencc_config: s2t.json

reverse_lookup:
  dictionary: luna_pinyin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    # Mac 字母鍵直接輸入 J/K/L/U/I/O；數字小鍵盤 1–6 轉為相同六鍵。
    - { when: always, accept: KP_1, send: j }
    - { when: always, accept: KP_2, send: k }
    - { when: always, accept: KP_3, send: l }
    - { when: always, accept: KP_4, send: u }
    - { when: always, accept: KP_5, send: i }
    - { when: always, accept: KP_6, send: o }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
